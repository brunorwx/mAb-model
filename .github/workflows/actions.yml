name: mAb model
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: uv sync --all-extras && uv run python -m pip install -e .
    - name: Lint with ruff
      run: uv run ruff check .
    - name: Test with pytest
      run: uv run pytest